[package]
name = "ytmusic-core"
version = "1.0.0"
edition = "2021"
authors = ["Emilio <egmd3892@gmail.com>"]
description = "High-performance core engine for YouTube Music Pro (extraction, download, metadata, tagging and library)"

[lib]
name = "ytmusic_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ytmusic-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
tokio = { version = "1.39", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "cookies"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lofty = "0.25"
uniffi = { version = "0.28", features = ["cli"] }
rusqlite = { version = "0.32", features = ["bundled"] }
once_cell = "1.20"
regex = "1.10"
url = "2.5"
futures-util = "0.3"
walkdir = "2.5"
anyhow = "1.0"
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
