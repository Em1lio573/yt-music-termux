name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Install Frontend Dependencies
        working-directory: mobile_app/frontend
        run: npm install

      - name: Build Web Assets (Vite)
        working-directory: mobile_app/frontend
        run: npm run build

      - name: Sync Capacitor
        working-directory: mobile_app/frontend
        run: npx cap sync android

      - name: Configure Android Project & Compatibility
        run: |
          echo "sdk.dir=$ANDROID_HOME" > mobile_app/frontend/android/local.properties
          sed -i 's/VERSION_21/VERSION_17/g' mobile_app/frontend/android/app/capacitor.build.gradle 2>/dev/null || true
          sed -i 's/VERSION_21/VERSION_17/g' mobile_app/frontend/android/capacitor-cordova-android-plugins/build.gradle 2>/dev/null || true
          sed -i 's/VERSION_21/VERSION_17/g' mobile_app/frontend/node_modules/@capacitor/android/capacitor/build.gradle 2>/dev/null || true

      - name: Build APK with Gradle
        working-directory: mobile_app/frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Verify & Copy APK
        run: |
          cp mobile_app/frontend/android/app/build/outputs/apk/debug/app-debug.apk YT-Music-Pro.apk
          ls -lh YT-Music-Pro.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-Music-Pro-APK
          path: YT-Music-Pro.apk
