name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Install Frontend Dependencies
        working-directory: mobile_app/frontend
        run: npm install

      - name: Build Web Assets (Vite)
        working-directory: mobile_app/frontend
        run: npm run build

      - name: Configure Android Project & Compatibility
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > mobile_app/frontend/android/local.properties
          sed -i 's/VERSION_21/VERSION_17/g' mobile_app/frontend/android/app/build.gradle 2>/dev/null || true
          sed -i 's/VERSION_21/VERSION_17/g' mobile_app/frontend/android/app/capacitor.build.gradle 2>/dev/null || true
          sed -i 's/VERSION_21/VERSION_17/g' mobile_app/frontend/android/capacitor-cordova-android-plugins/build.gradle 2>/dev/null || true
          sed -i 's/VERSION_21/VERSION_17/g' mobile_app/frontend/node_modules/@capacitor/android/capacitor/build.gradle 2>/dev/null || true

      - name: Copy Web Assets to Android (Capacitor)
        working-directory: mobile_app/frontend
        run: npx cap copy android

      - name: Build APK with Gradle
        working-directory: mobile_app/frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Verify & Copy APK
        run: |
          APK_FILE="mobile_app/frontend/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "Error: No se encontró $APK_FILE"
            exit 1
          fi
          echo "APK generado con éxito: $APK_FILE"
          cp "$APK_FILE" YT-Music-Pro.apk
          ls -lh YT-Music-Pro.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-Music-Pro-APK
          path: YT-Music-Pro.apk
