name: Build & Release Native Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Build Native Android APK (Rust Core + Jetpack Compose)
        working-directory: android
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          APK_FILE="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "Error: No se encontró $APK_FILE"
            exit 1
          fi
          cp "$APK_FILE" YT-Music-Pro.apk
          ls -lh YT-Music-Pro.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-Music-Pro-APK
          path: YT-Music-Pro.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "YouTube Music Pro ${{ github.ref_name }}"
          body: |
            ## YouTube Music Pro ${{ github.ref_name }} (100% Nativa: Rust NDK + Kotlin Jetpack Compose)

            ### Novedades principales:
            - **Arquitectura 100% Nativa:** Motor en Rust (descargas concurrentes, Innertube, Lofty tags) + UI en Kotlin Jetpack Compose con efectos Apple Design (`applePressEffect`, `appleGlass`, Now Playing a pantalla completa).
            - **Reproductor Unificado (Local + Web Music):** Un solo coordinador de audio, una sola notificación/pantalla de bloqueo con carátula real, barra de progreso deslizable (`ACTION_SEEK_TO`), reproducción en segundo plano y pausa automática al desconectar audífonos.
            - **Navegador Web Music Optimizado:** Bloqueo de anuncios y avisos invasivos, caché persistente de WebView (apertura instantánea entre pestañas) y botón de descarga integrado en cabecera.
            - **Metadatos y Biblioteca Limpia:** Artista principal + secundarios completos, carátulas incrustadas (sin `.jpg` sueltos en tu Galería), limpieza automática de duplicados entre formatos y modos **Aleatorio** y **Aleatorio Inteligente** (ponderado por tus más escuchadas).
            - **Audio DSP sin picos:** Suavizado anti-pop al adelantar/retroceder en la barra de progreso.
          files: |
            YT-Music-Pro.apk
          draft: false
          prerelease: false
