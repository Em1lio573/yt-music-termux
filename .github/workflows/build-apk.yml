name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Install Frontend Dependencies
        working-directory: mobile_app/frontend
        run: npm install

      - name: Build Web Assets (Vite)
        working-directory: mobile_app/frontend
        run: npm run build

      - name: Configure Android Project & Compatibility
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > mobile_app/frontend/android/local.properties
          cat mobile_app/frontend/android/local.properties
          sed -i 's/VERSION_21/VERSION_17/g' mobile_app/frontend/android/app/build.gradle 2>/dev/null || true
          sed -i 's/VERSION_21/VERSION_17/g' mobile_app/frontend/android/app/capacitor.build.gradle 2>/dev/null || true
          sed -i 's/VERSION_21/VERSION_17/g' mobile_app/frontend/android/capacitor-cordova-android-plugins/build.gradle 2>/dev/null || true
          sed -i 's/VERSION_21/VERSION_17/g' mobile_app/frontend/node_modules/@capacitor/android/capacitor/build.gradle 2>/dev/null || true

      - name: Sync Capacitor
        working-directory: mobile_app/frontend
        run: |
          chmod +x android/gradlew
          npx cap sync android --verbose 2>&1 | tee /tmp/sync.log || (echo "### Capacitor Sync Failed" >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && cat /tmp/sync.log >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && exit 1)
          sed -i 's/VERSION_21/VERSION_17/g' android/app/capacitor.build.gradle 2>/dev/null || true

      - name: Build APK with Gradle
        working-directory: mobile_app/frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.java.home="$JAVA_HOME" 2>&1 | tee /tmp/gradle.log
          GRADLE_STATUS=${PIPESTATUS[0]}
          if [ $GRADLE_STATUS -ne 0 ]; then
            ERROR_MSG=$(grep -E '(FAILURE|FAILED|Error|Caused by)' /tmp/gradle.log | head -n 10 | tr '\n' ' -- ')
            echo "::error title=GradleFailure::$ERROR_MSG"
            tail -n 60 /tmp/gradle.log
            exit $GRADLE_STATUS
          fi

      - name: Verify & Copy APK
        run: |
          APK_FILE=$(find . -name "*.apk" -not -path "*/.*" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "No se encontró ningún APK generado. Contenido de build:"
            find mobile_app/frontend/android/app/build -maxdepth 4 2>/dev/null || true
            exit 1
          fi
          echo "APK encontrado en: $APK_FILE"
          cp "$APK_FILE" YT-Music-Pro.apk
          ls -lh YT-Music-Pro.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-Music-Pro-APK
          path: YT-Music-Pro.apk
